name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: npm ci
      - run: npm run build:android:release
      - run: cd ios && pod install
      - run: npm run build:ios:release
      - name: Upload to TestFlight
        run: echo "Uploading to TestFlight via xcrun altool..."
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      - name: Upload to Play Console internal track
        run: echo "Uploading to Google Play Console via fastlane..."
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY }}
